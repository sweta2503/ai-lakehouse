# AI Lakehouse infra: MinIO (S3) + Iceberg REST catalog. Qdrant only with `--profile bonus`.
#
# Image note: the official minio/minio images were removed from Docker Hub/Quay in 2025,
# so we use the (frozen) bitnamilegacy builds of the same MinIO server and client.
# Fine for a local demo; not something to run in production.
name: ai-lakehouse

services:
  minio:
    image: bitnamilegacy/minio:2025.7.23
    container_name: lakehouse-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_DEFAULT_BUCKETS: ""
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fs http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: create the `warehouse` bucket, then exit.
  mc:
    image: bitnamilegacy/minio-client:2025.4.16
    container_name: lakehouse-mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${WAREHOUSE_BUCKET:-warehouse} &&
      echo 'bucket ready'
      "
    restart: "no"

  # Iceberg REST catalog (reference fixture: SQLite-backed JDBC catalog behind the REST API).
  rest:
    image: apache/iceberg-rest-fixture:${ICEBERG_VERSION:-1.9.2}
    container_name: lakehouse-rest
    # Named volumes are root-owned; the image's default user cannot create the SQLite file there.
    user: "0:0"
    depends_on:
      mc:
        condition: service_completed_successfully
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      CATALOG_WAREHOUSE: s3://${WAREHOUSE_BUCKET:-warehouse}/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      # In-network endpoint: this is what the *server* uses. The host cannot resolve
      # `minio`, so the Spark client overrides it (see src/common.py + README troubleshooting).
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      # Persist catalog state (table pointers) across container restarts.
      CATALOG_URI: jdbc:sqlite:file:/catalog-data/catalog.db
    volumes:
      - catalog-data:/catalog-data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8181/v1/config || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Bonus only: docker compose --profile bonus up -d
  qdrant:
    image: qdrant/qdrant:v1.14.1
    container_name: lakehouse-qdrant
    profiles: ["bonus"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  minio-data:
  catalog-data:
  qdrant-data:
